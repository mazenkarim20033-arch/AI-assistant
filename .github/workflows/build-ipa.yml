name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

jobs:
  build:
    # mlx-swift-lm needs Swift 6.2 (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Apple's published YOLOv3 object detector (80 everyday object types). Downloaded here so the
      # 124 MB file isn't stored in the repository; Xcode compiles it into the app.
      # Swap to YOLOv3TinyFP16 (17 MB, faster, less accurate) by changing the URL.
      - name: Download object detection model
        run: |
          mkdir -p Sources/Models
          curl -fL --retry 3 -o Sources/Models/YOLOv3Detector.mlmodel \
            https://ml-assets.apple.com/coreml/models/Image/ObjectDetection/YOLOv3/YOLOv3FP16.mlmodel
          ls -l Sources/Models

      - name: Generate Xcode project
        run: xcodegen generate

      # Most of the build time is compiling the MLX libraries, which almost never change.
      # Restore them from the previous run so only the app's own code is rebuilt. Each run saves
      # a fresh copy (the run id in the key); a cache miss just means a slow, normal build.
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages
            build/Build/Intermediates.noindex
          key: xcode-${{ runner.os }}-${{ hashFiles('project.yml') }}-${{ github.run_id }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ hashFiles('project.yml') }}-
            xcode-${{ runner.os }}-

      - name: Build (unsigned; Sideloadly signs it later)
        run: |
          set -o pipefail
          xcodebuild build \
            -project LocalAssistant.xcodeproj \
            -scheme LocalAssistant \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          grep -E ": error: " build.log | grep -v -E "clang|-ferror|builtin-" | sort -u | head -15 | while IFS= read -r line; do echo "::error::${line:0:500}"; done
          echo "::error::TAIL: $(tail -25 build.log | grep -v -E 'clang|builtin-' | cut -c1-200 | tr '\n' '|' | cut -c1-900)"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LocalAssistant.app Payload/
          zip -qr LocalAssistant.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LocalAssistant-ipa
          path: LocalAssistant.ipa
